<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .bg-circle {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
  }
  .bg-c1 { top: -200px; right: -200px; width: 600px; height: 600px; background: rgba(255,255,255,0.04); }
  .bg-c2 { bottom: -150px; left: -180px; width: 500px; height: 500px; background: rgba(255,255,255,0.03); }
  .bg-c3 { top: 400px; left: -100px; width: 300px; height: 300px; background: rgba(255,255,255,0.02); }

  .watermark {
    position: absolute;
    bottom: 28px;
    right: 36px;
    color: rgba(255,255,255,0.25);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    z-index: 10;
  }

  .top-area {
    z-index: 2;
    text-align: center;
    margin-bottom: 28px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .logo-badge {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 60px;
    padding: 10px 36px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge span {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .scene-label {
    color: #F59E0B;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .plan-label {
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #fff;
    font-size: 42px;
    font-weight: 900;
    padding: 12px 48px;
    border-radius: 40px;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .phone {
    z-index: 2;
    width: 600px;
    height: 920px;
    border-radius: 56px;
    border: 8px solid #1F2937;
    background: #1F2937;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 32px;
    background: #1F2937;
    border-radius: 0 0 20px 20px;
    z-index: 5;
  }
  .phone-notch::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #374151;
    border-radius: 50%;
  }
  .phone-statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 4;
  }
  .phone-statusbar .time { font-size: 16px; font-weight: 700; }
  .phone-statusbar .icons { font-size: 14px; letter-spacing: 4px; }
  .phone-screen {
    width: 100%; height: 100%;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── Text styles: Dark screen ── */
  .dark-title {
    color: #fff;
    font-weight: 900;
    text-align: center;
    line-height: 1.3;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.3);
    text-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.3);
  }
  .dark-title .hl { color: #F59E0B; }

  /* ── Text styles: Light screen ── */
  .light-title {
    color: #0F172A;
    font-weight: 900;
    text-align: center;
    line-height: 1.3;
    -webkit-text-stroke: 1px rgba(0,0,0,0.1);
    text-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .light-title .hl { color: #FF4444; }

  /* ── Price text ── */
  .price-text {
    color: #FF4444;
    font-weight: 900;
    text-align: center;
    line-height: 1.1;
    -webkit-text-stroke: 2px rgba(0,0,0,0.15);
    text-shadow: 0 6px 24px rgba(255,68,68,0.4), 0 2px 4px rgba(0,0,0,0.3);
  }
  .price-dark {
    -webkit-text-stroke: 2px rgba(0,0,0,0.2);
    text-shadow: 0 6px 24px rgba(255,68,68,0.5), 0 2px 4px rgba(0,0,0,0.4);
  }

  /* ── Accent text ── */
  .accent-text {
    color: #F59E0B;
    font-weight: 900;
    text-align: center;
    line-height: 1.2;
    -webkit-text-stroke: 1.5px rgba(0,0,0,0.2);
    text-shadow: 0 4px 16px rgba(245,158,11,0.4), 0 2px 4px rgba(0,0,0,0.3);
  }

  /* ── Logo ── */
  .carrier-logo { border-radius: 12px; }
  .logos-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .vs-badge {
    color: #F59E0B;
    font-size: 36px;
    font-weight: 900;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  /* ── Verdict ── */
  .verdict-box { width: 100%; border-radius: 20px; padding: 32px 20px; text-align: center; }
  .verdict-box-top { background: linear-gradient(135deg, #1D4ED8, #2563EB); border-radius: 20px 20px 0 0; }
  .verdict-vs { background: #1E293B; padding: 14px 0; display: flex; align-items: center; justify-content: center; }
  .verdict-vs span { color: #F59E0B; font-size: 32px; font-weight: 900; letter-spacing: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .verdict-box-bottom { background: linear-gradient(135deg, #16A34A, #15803D); border-radius: 0 0 20px 20px; }
  .verdict-text { color: #fff; font-size: 36px; font-weight: 900; line-height: 1.35; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .verdict-single { background: linear-gradient(135deg, #1D4ED8, #2563EB); border-radius: 20px; padding: 40px 28px; width: 100%; }
  .verdict-single .verdict-text { font-size: 40px; }

  /* ── CTA ── */
  .screen-cta { background: #F7FAFC; display: flex; flex-direction: column; padding: 0; }
  .screen-cta .phone-statusbar { color: #475569; }
  .cta-urlbar { background: #F1F5F9; margin: 52px 16px 0; border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
  .cta-urlbar .lock { font-size: 14px; color: #16A34A; }
  .cta-urlbar .url { font-size: 16px; color: #475569; font-weight: 700; }
  .cta-content { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .cta-heading { color: #0F172A; font-size: 32px; font-weight: 900; text-align: center; line-height: 1.3; }
  .cta-form-item { background: #fff; border: 2px solid #E2E8F0; border-radius: 14px; padding: 14px 18px; }
  .cta-form-label { color: #475569; font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .cta-form-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .cta-form-option { background: #EFF6FF; border: 2px solid #BFDBFE; border-radius: 20px; padding: 6px 14px; font-size: 15px; font-weight: 700; color: #1D4ED8; }
  .cta-form-option.selected { background: #1D4ED8; color: #fff; border-color: #1D4ED8; }
  .cta-button { background: #F59E0B; border-radius: 16px; padding: 18px 0; text-align: center; margin-top: 4px; }
  .cta-button span { color: #0F172A; font-size: 28px; font-weight: 900; }
  .cta-note { text-align: center; color: #94A3B8; font-size: 16px; font-weight: 700; }
  .cta-footer { background: #0F172A; padding: 18px 0; text-align: center; margin-top: auto; }
  .cta-footer span { color: #fff; font-size: 24px; font-weight: 900; letter-spacing: 3px; }

  .subtitle-area {
    z-index: 2;
    width: 600px;
    margin-top: 16px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 12px;
    padding: 12px 24px;
    text-align: center;
    min-height: 0;
  }
  .subtitle-text {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.5;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .bottom-area { z-index: 2; text-align: center; margin-top: 24px; min-height: 60px; }
  .bottom-text { color: rgba(255,255,255,0.7); font-size: 28px; font-weight: 700; line-height: 1.4; }
  .bottom-cta-btn {
    display: inline-block; background: #F59E0B; color: #0F172A;
    font-size: 32px; font-weight: 900; padding: 14px 48px; border-radius: 40px;
    margin-top: 12px; box-shadow: 0 4px 24px rgba(245,158,11,0.3);
  }
</style>
</head>
<body>

  <div class="bg-circle bg-c1"></div>
  <div class="bg-circle bg-c2"></div>
  <div class="bg-circle bg-c3"></div>

  <div class="top-area" id="top-area"></div>

  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="phone-screen"></div>
  </div>

  <div class="subtitle-area" id="subtitle-area"></div>

  <div class="bottom-area" id="bottom-area"></div>

  <span class="watermark">smaplan.com</span>

<script>
const SCENE_TYPE = '{{SCENE_TYPE}}';
const DATA = JSON.parse('{{DATA}}');

const topArea = document.getElementById('top-area');
const screen = document.getElementById('phone-screen');
const subtitleArea = document.getElementById('subtitle-area');
const bottomArea = document.getElementById('bottom-area');

function statusBar(light) {
  const c = light ? 'rgba(255,255,255,0.5)' : '#475569';
  return `<div class="phone-statusbar" style="color:${c}"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>`;
}

function fmt(text, hlClass) {
  const cls = hlClass || 'hl';
  return (text || '')
    .replace(/\n/g, '<br>')
    .replace(/\*\*([^*]+)\*\*/g, `<span class="${cls}">$1</span>`);
}

function extractPrice(text) {
  const m = (text || '').match(/([\d,]+)\s*円/);
  return m ? m[1].replace(/,/g, '') : '';
}

function logosHTML(logos, width, height) {
  if (!logos || logos.length === 0) return '';
  const w = width || 280;
  const h = height || 84;
  return logos.map(src => {
    if (src.endsWith('.png')) {
      return `<img src="${src}" style="height:${h}px;width:auto;object-fit:contain;" />`;
    }
    return `<img src="${src}" class="carrier-logo" width="${w}" height="${h}" />`;
  }).join('');
}

function logoTag(src, w, h) {
  if (src.endsWith('.png')) {
    return `<img src="${src}" style="height:${h}px;width:auto;object-fit:contain;" />`;
  }
  return `<img src="${src}" class="carrier-logo" width="${w}" height="${h}" />`;
}

function logosVsHTML(logos) {
  if (!logos || logos.length < 2) return logosHTML(logos, 220, 66);
  return `<div class="logos-row">
    ${logoTag(logos[0], 200, 60)}
    <span class="vs-badge">VS</span>
    ${logoTag(logos[1], 200, 60)}
  </div>`;
}

function setBodyBg(gradient) {
  document.body.style.background = gradient;
}

// ── SCENE CONFIG: background per scene type ──
const SCENE_STYLES = {
  opening:      { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  plan_a_name:  { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: '#FFFFFF', dark: false },
  plan_b_name:  { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: '#FFFFFF', dark: false },
  plan_a:       { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: '#FFFFFF', dark: false },
  plan_b:       { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: '#FFFFFF', dark: false },
  plan_a_point: { bodyBg: 'linear-gradient(160deg, #D6E4FF 0%, #EFF6FF 100%)', screenBg: '#FFFFFF', dark: false },
  plan_b_point: { bodyBg: 'linear-gradient(160deg, #D1FAE5 0%, #F0FDF4 100%)', screenBg: '#FFFFFF', dark: false },
  compare:      { bodyBg: 'linear-gradient(160deg, #0C1929 0%, #1E3A5F 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  verdict:      { bodyBg: 'linear-gradient(160deg, #0C1929 0%, #111827 100%)', screenBg: '#0F172A', dark: true },
  problem:      { bodyBg: 'linear-gradient(160deg, #F97316 0%, #EA580C 100%)', screenBg: '#FFFFFF', dark: false },
  question:     { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  question2:    { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  reveal:       { bodyBg: 'linear-gradient(160deg, #059669 0%, #10B981 100%)', screenBg: '#FFFFFF', dark: false },
  benefit:      { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false },
  benefit2:     { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false },
  tip1:         { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false },
  tip1_detail:  { bodyBg: 'linear-gradient(160deg, #D6E4FF 0%, #EFF6FF 100%)', screenBg: '#FFFFFF', dark: false },
  tip2:         { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false },
  tip2_detail:  { bodyBg: 'linear-gradient(160deg, #D6E4FF 0%, #EFF6FF 100%)', screenBg: '#FFFFFF', dark: false },
  tip3:         { bodyBg: 'linear-gradient(160deg, #F97316 0%, #EA580C 100%)', screenBg: '#FFFFFF', dark: false },
  fact:         { bodyBg: 'linear-gradient(160deg, #F97316 0%, #EA580C 100%)', screenBg: '#FFFFFF', dark: false },
  fact_impact:  { bodyBg: 'linear-gradient(160deg, #DC2626 0%, #B91C1C 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  detail:       { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false },
  solution:     { bodyBg: 'linear-gradient(160deg, #059669 0%, #10B981 100%)', screenBg: '#FFFFFF', dark: false },
  solution_benefit: { bodyBg: 'linear-gradient(160deg, #059669 0%, #10B981 100%)', screenBg: '#FFFFFF', dark: false },
  rank1:        { bodyBg: 'linear-gradient(160deg, #92400E 0%, #D97706 50%, #F59E0B 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  rank2:        { bodyBg: 'linear-gradient(160deg, #374151 0%, #6B7280 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  rank3:        { bodyBg: 'linear-gradient(160deg, #78350F 0%, #92400E 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  rank1_name:   { bodyBg: 'linear-gradient(160deg, #92400E 0%, #D97706 50%, #F59E0B 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  rank1_point:  { bodyBg: 'linear-gradient(160deg, #92400E 0%, #D97706 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  rank1_detail: { bodyBg: 'linear-gradient(160deg, #92400E 0%, #D97706 100%)', screenBg: 'linear-gradient(180deg, #0F172A 0%, #1E293B 100%)', dark: true },
  cta:          { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%)', screenBg: '#F7FAFC', dark: false },
};

function getStyle() {
  return SCENE_STYLES[SCENE_TYPE] || { bodyBg: 'linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 100%)', screenBg: '#FFFFFF', dark: false };
}

function renderOpening() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  topArea.innerHTML = `<div class="logo-badge"><span>📱 スマプラン</span></div>`;

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;
  screen.innerHTML = `
    ${statusBar(true)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:28px;">
      <div class="dark-title" style="font-size:64px;">${fmt(DATA.displayText)}</div>
      <div style="width:80px;height:5px;background:#F59E0B;border-radius:3px;"></div>
      ${DATA.logos && DATA.logos.length > 0 ? `<div class="logos-row">${logosHTML(DATA.logos, 200, 60)}</div>` : ''}
    </div>
  `;

  bottomArea.innerHTML = `<div class="bottom-text">スマプランが徹底解説！</div>`;
}

function renderPlanName() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  const label = SCENE_TYPE.includes('plan_a') ? 'Plan A' : 'Plan B';
  topArea.innerHTML = `<span class="plan-label">${label}</span>`;

  const price = DATA.price || extractPrice(DATA.displayText);
  const priceFormatted = price ? Number(price).toLocaleString() : '';
  const planName = DATA.planName || DATA.displayText || '';

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;
  screen.innerHTML = `
    ${statusBar(false)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:16px;">
      ${DATA.logos && DATA.logos.length > 0 ? logosHTML(DATA.logos, 300, 90) : ''}
      <div class="light-title" style="font-size:48px;">${fmt(planName)}</div>
      ${priceFormatted ? `
        <div class="price-text" style="font-size:100px;">${priceFormatted}<span style="font-size:40px;">円</span></div>
        <div style="color:#64748B;font-size:26px;font-weight:700;">月額（税込）</div>
      ` : ''}
      ${DATA.dataGb ? `<div style="background:#EFF6FF;border:2px solid #BFDBFE;border-radius:24px;padding:8px 24px;"><span style="color:#1D4ED8;font-size:32px;font-weight:900;">📱 ${DATA.dataGb}</span></div>` : ''}
    </div>
  `;

  bottomArea.innerHTML = '';
}

function renderPlanPoint() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  const label = SCENE_TYPE.includes('plan_a') ? 'Plan A の強み' : 'Plan B の強み';
  topArea.innerHTML = `<span class="scene-label">${label}</span>`;

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;
  screen.innerHTML = `
    ${statusBar(false)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 28px;gap:24px;">
      ${DATA.logos && DATA.logos.length > 0 ? logosHTML(DATA.logos, 180, 54) : ''}
      <div class="light-title" style="font-size:56px;">${fmt(DATA.displayText)}</div>
    </div>
  `;

  bottomArea.innerHTML = '';
}

function renderMain() {
  const s = getStyle();
  setBodyBg(s.bodyBg);

  const LABEL_MAP = {
    problem: '⚠️ 注意', question: '🤔 質問', question2: '🤔 質問',
    reveal: '💡 解決策', benefit: '✨ メリット', benefit2: '✨ メリット',
    tip1: '💡 Tips', tip1_detail: '💡 詳細', tip2: '💡 Tips', tip2_detail: '💡 詳細',
    tip3: '💡 最大の節約', fact: '😲 事実', fact_impact: '💥 インパクト',
    detail: '🔍 解説', solution: '✅ 解決策', solution_benefit: '✅ 効果',
    compare: '⚡ 比較', main: '📋 ポイント',
    rank1_point: '🏆 1位の理由', rank1_detail: '🏆 1位の魅力',
  };
  const label = LABEL_MAP[SCENE_TYPE] || DATA.label || SCENE_TYPE;
  topArea.innerHTML = `<span class="scene-label">${label}</span>`;

  const dt = DATA.displayText || '';
  const cleanDt = dt.replace(/\*\*/g, '');
  const price = extractPrice(cleanDt);
  const hasPrice = price && cleanDt.includes('円');
  const titleClass = s.dark ? 'dark-title' : 'light-title';
  const priceExtra = s.dark ? 'price-dark' : '';

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;

  const isCompare = SCENE_TYPE === 'compare';

  if (hasPrice) {
    const priceFormatted = Number(price).toLocaleString();
    const textWithoutPrice = cleanDt.replace(/([\d,]+)\s*円[^\n]*/g, '').replace(/\\n/g, ' ').trim();
    screen.innerHTML = `
      ${statusBar(s.dark)}
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:20px;">
        ${isCompare && DATA.logos ? logosVsHTML(DATA.logos) : (DATA.logos && DATA.logos.length > 0 ? logosHTML(DATA.logos, 200, 60) : '')}
        ${textWithoutPrice ? `<div class="${titleClass}" style="font-size:48px;">${textWithoutPrice}</div>` : ''}
        <div class="price-text ${priceExtra}" style="font-size:96px;">${priceFormatted}<span style="font-size:40px;">円</span></div>
      </div>
    `;
  } else {
    screen.innerHTML = `
      ${statusBar(s.dark)}
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 28px;gap:24px;">
        ${isCompare && DATA.logos ? logosVsHTML(DATA.logos) : (DATA.logos && DATA.logos.length > 0 ? logosHTML(DATA.logos, 200, 60) : '')}
        <div class="${titleClass}" style="font-size:56px;">${fmt(dt)}</div>
      </div>
    `;
  }

  bottomArea.innerHTML = '';
}

function renderRank() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  topArea.innerHTML = `<span class="scene-label">🏆 ランキング</span>`;

  const rank = DATA.rank || 1;
  const rankColors = { 1: '#F59E0B', 2: '#9CA3AF', 3: '#CD7F32' };
  const rankColor = rankColors[rank] || '#F59E0B';
  const price = DATA.price || extractPrice(DATA.displayText);
  const priceFormatted = price ? Number(price).toLocaleString() : '';
  const planName = DATA.planName || DATA.displayText || '';

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;
  screen.innerHTML = `
    ${statusBar(true)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;gap:12px;">
      <div style="display:flex;align-items:baseline;justify-content:center;">
        <span style="font-size:120px;font-weight:900;color:${rankColor};line-height:1;text-shadow:0 4px 16px rgba(0,0,0,0.4);-webkit-text-stroke:2px rgba(0,0,0,0.2);">${rank}</span>
        <span style="font-size:44px;font-weight:900;color:rgba(255,255,255,0.5);">位</span>
      </div>
      ${DATA.logos && DATA.logos.length > 0 ? logosHTML(DATA.logos, 240, 72) : ''}
      <div class="dark-title" style="font-size:44px;">${fmt(planName)}</div>
      ${priceFormatted ? `<div class="price-text price-dark" style="font-size:88px;">${priceFormatted}<span style="font-size:36px;">円</span></div>` : ''}
      ${DATA.dataGb ? `<div class="accent-text" style="font-size:36px;">📱 ${DATA.dataGb}</div>` : ''}
    </div>
  `;

  bottomArea.innerHTML = '';
}

function renderVerdict() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  topArea.innerHTML = `<span class="scene-label">⚡ 結論</span>`;

  screen.className = 'phone-screen';
  screen.style.background = s.screenBg;

  if (DATA.right) {
    screen.innerHTML = `
      ${statusBar(true)}
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:100%;padding:56px 24px 24px;">
        ${DATA.logos && DATA.logos.length >= 2 ? logosVsHTML(DATA.logos) : ''}
        <div class="verdict-box verdict-box-top" style="margin-top:16px;">
          <div class="verdict-text">${fmt(DATA.left)}</div>
        </div>
        <div class="verdict-vs"><span>VS</span></div>
        <div class="verdict-box verdict-box-bottom">
          <div class="verdict-text">${fmt(DATA.right)}</div>
        </div>
      </div>
    `;
  } else {
    screen.innerHTML = `
      ${statusBar(true)}
      <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:24px;">
        <div class="verdict-single">
          <div class="verdict-text">${fmt(DATA.left || DATA.displayText)}</div>
        </div>
      </div>
    `;
  }

  bottomArea.innerHTML = `<div class="bottom-text">あなたに合うのはどっち？</div>`;
}

function renderCTA() {
  const s = getStyle();
  setBodyBg(s.bodyBg);
  topArea.innerHTML = `<div class="bottom-cta-btn">無料診断してみる →</div>`;

  screen.className = 'phone-screen screen-cta';
  screen.innerHTML = `
    ${statusBar(false)}
    <div class="cta-urlbar">
      <span class="lock">🔒</span>
      <span class="url">smaplan.com</span>
    </div>
    <div class="cta-content">
      <div class="cta-heading">📱 あなたに最適な<br>スマホプランは？</div>
      <div class="cta-form-item">
        <div class="cta-form-label">月のデータ使用量は？</div>
        <div class="cta-form-options">
          <span class="cta-form-option">〜3GB</span>
          <span class="cta-form-option selected">3〜10GB</span>
          <span class="cta-form-option">10〜20GB</span>
          <span class="cta-form-option">20GB〜</span>
        </div>
      </div>
      <div class="cta-form-item">
        <div class="cta-form-label">通話の頻度は？</div>
        <div class="cta-form-options">
          <span class="cta-form-option">ほぼしない</span>
          <span class="cta-form-option selected">たまにする</span>
          <span class="cta-form-option">よくする</span>
        </div>
      </div>
      <div class="cta-form-item">
        <div class="cta-form-label">こだわりポイントは？</div>
        <div class="cta-form-options">
          <span class="cta-form-option selected">安さ重視</span>
          <span class="cta-form-option">速度重視</span>
          <span class="cta-form-option">サポート</span>
        </div>
      </div>
      <div class="cta-button"><span>👆 無料で診断する →</span></div>
      <div class="cta-note">30秒で完了・登録不要・完全無料</div>
    </div>
    <div class="cta-footer"><span>smaplan.com</span></div>
  `;

  bottomArea.innerHTML = `<div class="bottom-text">${DATA.displayText || 'プロフィールのリンクから！'}</div>`;
}

function showSubtitle() {
  const sub = DATA.subtitle;
  if (sub && SCENE_TYPE !== 'cta') {
    subtitleArea.innerHTML = `<div class="subtitle-text">${sub}</div>`;
  } else {
    subtitleArea.style.display = 'none';
  }
}

switch (SCENE_TYPE) {
  case 'opening':
    renderOpening(); break;
  case 'plan_a_name': case 'plan_b_name': case 'plan_a': case 'plan_b':
    renderPlanName(); break;
  case 'plan_a_point': case 'plan_b_point':
    renderPlanPoint(); break;
  case 'rank1': case 'rank2': case 'rank3': case 'rank1_name':
    renderRank(); break;
  case 'verdict':
    renderVerdict(); break;
  case 'cta':
    renderCTA(); break;
  default:
    renderMain(); break;
}
showSubtitle();
</script>
</body>
</html>
