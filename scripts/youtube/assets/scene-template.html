<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(160deg, #1E3A5F 0%, #1D4ED8 50%, #1E40AF 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── Background decorations ── */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
  }
  .bg-c1 { top: -200px; right: -200px; width: 600px; height: 600px; background: rgba(255,255,255,0.04); }
  .bg-c2 { bottom: -150px; left: -180px; width: 500px; height: 500px; background: rgba(255,255,255,0.03); }
  .bg-c3 { top: 400px; left: -100px; width: 300px; height: 300px; background: rgba(255,255,255,0.02); }

  /* ── Watermark ── */
  .watermark {
    position: absolute;
    bottom: 28px;
    right: 36px;
    color: rgba(255,255,255,0.25);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    z-index: 10;
  }

  /* ── Top area (above phone) ── */
  .top-area {
    z-index: 2;
    text-align: center;
    margin-bottom: 32px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .logo-badge {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 60px;
    padding: 10px 36px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge span {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .scene-label {
    color: #F59E0B;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .plan-label {
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #fff;
    font-size: 38px;
    font-weight: 900;
    padding: 10px 40px;
    border-radius: 40px;
    letter-spacing: 3px;
  }

  /* ── Phone mockup ── */
  .phone {
    z-index: 2;
    width: 560px;
    height: 880px;
    border-radius: 56px;
    border: 8px solid #1F2937;
    background: #1F2937;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 32px;
    background: #1F2937;
    border-radius: 0 0 20px 20px;
    z-index: 5;
  }
  .phone-notch::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #374151;
    border-radius: 50%;
  }
  .phone-statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    z-index: 4;
  }
  .phone-statusbar .time {
    font-size: 16px;
    font-weight: 700;
  }
  .phone-statusbar .icons {
    font-size: 14px;
    letter-spacing: 4px;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  /* ── Screen: opening ── */
  .screen-opening {
    background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 32px;
    gap: 28px;
  }
  .screen-opening .phone-statusbar { color: rgba(255,255,255,0.5); }
  .screen-opening .title {
    color: #fff;
    font-size: 38px;
    font-weight: 900;
    text-align: center;
    line-height: 1.35;
  }
  .screen-opening .divider {
    width: 80px;
    height: 4px;
    background: #1D4ED8;
    border-radius: 2px;
  }
  .screen-opening .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
  }

  /* ── Screen: plan ── */
  .screen-plan {
    background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
    display: flex;
    flex-direction: column;
    padding: 56px 28px 28px;
    gap: 0;
  }
  .screen-plan .phone-statusbar { color: rgba(255,255,255,0.5); }
  .screen-plan .plan-header {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
    margin-bottom: 16px;
  }
  .screen-plan .plan-name {
    color: #fff;
    font-size: 34px;
    font-weight: 900;
    line-height: 1.2;
  }
  .screen-plan .plan-pricing {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin-top: 8px;
  }
  .screen-plan .plan-pricing .amount {
    color: #60A5FA;
    font-size: 64px;
    font-weight: 900;
    line-height: 1;
  }
  .screen-plan .plan-pricing .unit {
    color: rgba(255,255,255,0.6);
    font-size: 24px;
    font-weight: 700;
  }
  .screen-plan .plan-data-badge {
    display: inline-block;
    background: rgba(96,165,250,0.15);
    border: 2px solid rgba(96,165,250,0.3);
    border-radius: 20px;
    padding: 6px 20px;
    margin-top: 10px;
  }
  .screen-plan .plan-data-badge span {
    color: #60A5FA;
    font-size: 24px;
    font-weight: 900;
  }
  .screen-plan .features-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
    flex: 1;
  }
  .screen-plan .feature-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .screen-plan .feature-icon {
    font-size: 26px;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .screen-plan .feature-text {
    color: rgba(255,255,255,0.85);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    flex: 1;
  }

  /* ── Screen: main (generic) ── */
  .screen-main {
    background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
    display: flex;
    flex-direction: column;
    padding: 56px 28px 28px;
    gap: 16px;
  }
  .screen-main .phone-statusbar { color: rgba(255,255,255,0.5); }
  .screen-main .main-title {
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    line-height: 1.35;
    padding: 0 8px;
  }
  .screen-main .main-divider {
    width: 60px;
    height: 3px;
    background: #60A5FA;
    border-radius: 2px;
    align-self: center;
  }
  .screen-main .features-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .screen-main .feature-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .screen-main .feature-icon {
    font-size: 26px;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .screen-main .feature-text {
    color: rgba(255,255,255,0.85);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    flex: 1;
  }

  /* ── Screen: rank ── */
  .screen-rank {
    background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 28px 28px;
    gap: 12px;
  }
  .screen-rank .phone-statusbar { color: rgba(255,255,255,0.5); }
  .screen-rank .rank-number {
    font-size: 100px;
    font-weight: 900;
    line-height: 1;
  }
  .screen-rank .rank-1 { color: #D97706; }
  .screen-rank .rank-2 { color: #6B7280; }
  .screen-rank .rank-3 { color: #92400E; }
  .screen-rank .rank-suffix {
    font-size: 36px;
    font-weight: 900;
    color: #9CA3AF;
    margin-left: 2px;
  }

  /* ── Screen: verdict ── */
  .screen-verdict {
    background: #0F172A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px 24px;
    gap: 0;
  }
  .screen-verdict .phone-statusbar { color: rgba(255,255,255,0.4); }
  .screen-verdict .verdict-box {
    width: 100%;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
  }
  .screen-verdict .verdict-box-top {
    background: linear-gradient(135deg, #1D4ED8, #2563EB);
    margin-bottom: 0;
    border-radius: 20px 20px 0 0;
  }
  .screen-verdict .verdict-vs {
    background: #1E293B;
    padding: 12px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen-verdict .verdict-vs span {
    color: #F59E0B;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
  }
  .screen-verdict .verdict-box-bottom {
    background: linear-gradient(135deg, #16A34A, #15803D);
    margin-top: 0;
    border-radius: 0 0 20px 20px;
  }
  .screen-verdict .verdict-text {
    color: #fff;
    font-size: 30px;
    font-weight: 900;
    line-height: 1.4;
  }
  .screen-verdict .verdict-single {
    background: linear-gradient(135deg, #1D4ED8, #2563EB);
    border-radius: 20px;
    padding: 36px 24px;
    width: 100%;
  }
  .screen-verdict .verdict-single .verdict-text {
    font-size: 34px;
  }

  /* ── Screen: CTA ── */
  .screen-cta {
    background: #F7FAFC;
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  .screen-cta .phone-statusbar { color: #475569; }
  .screen-cta .cta-urlbar {
    background: #F1F5F9;
    margin: 52px 16px 0;
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .screen-cta .cta-urlbar .lock { font-size: 14px; color: #16A34A; }
  .screen-cta .cta-urlbar .url { font-size: 16px; color: #475569; font-weight: 700; }
  .screen-cta .cta-content {
    flex: 1;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .screen-cta .cta-heading {
    color: #0F172A;
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    line-height: 1.3;
  }
  .screen-cta .cta-form-item {
    background: #fff;
    border: 2px solid #E2E8F0;
    border-radius: 14px;
    padding: 14px 18px;
  }
  .screen-cta .cta-form-label {
    color: #475569;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .screen-cta .cta-form-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .screen-cta .cta-form-option {
    background: #EFF6FF;
    border: 2px solid #BFDBFE;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 700;
    color: #1D4ED8;
  }
  .screen-cta .cta-form-option.selected {
    background: #1D4ED8;
    color: #fff;
    border-color: #1D4ED8;
  }
  .screen-cta .cta-button {
    background: #F59E0B;
    border-radius: 16px;
    padding: 18px 0;
    text-align: center;
    margin-top: 4px;
  }
  .screen-cta .cta-button span {
    color: #0F172A;
    font-size: 28px;
    font-weight: 900;
  }
  .screen-cta .cta-note {
    text-align: center;
    color: #94A3B8;
    font-size: 16px;
    font-weight: 700;
  }
  .screen-cta .cta-footer {
    background: #0F172A;
    padding: 18px 0;
    text-align: center;
    margin-top: auto;
  }
  .screen-cta .cta-footer span {
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
  }

  /* ── Bottom area (below phone) ── */
  .bottom-area {
    z-index: 2;
    text-align: center;
    margin-top: 28px;
    min-height: 60px;
  }
  .bottom-text {
    color: rgba(255,255,255,0.7);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.4;
  }
  .bottom-cta-btn {
    display: inline-block;
    background: #F59E0B;
    color: #0F172A;
    font-size: 32px;
    font-weight: 900;
    padding: 14px 48px;
    border-radius: 40px;
    margin-top: 12px;
    box-shadow: 0 4px 24px rgba(245,158,11,0.3);
  }
</style>
</head>
<body>

  <div class="bg-circle bg-c1"></div>
  <div class="bg-circle bg-c2"></div>
  <div class="bg-circle bg-c3"></div>

  <div class="top-area" id="top-area"></div>

  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="phone-screen"></div>
  </div>

  <div class="bottom-area" id="bottom-area"></div>

  <span class="watermark">smaplan.com</span>

<script>
const SCENE_TYPE = '{{SCENE_TYPE}}';
const DATA = JSON.parse('{{DATA}}');

const topArea = document.getElementById('top-area');
const screen = document.getElementById('phone-screen');
const bottomArea = document.getElementById('bottom-area');

function statusBar(light) {
  const c = light ? 'rgba(255,255,255,0.5)' : '#475569';
  return `<div class="phone-statusbar" style="color:${c}"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>`;
}

function featuresHTML(features) {
  if (!features || features.length === 0) return '';
  return `<div class="features-list">${features.map(f =>
    `<div class="feature-item">
      <span class="feature-icon">${f.icon || '✅'}</span>
      <span class="feature-text">${f.text}</span>
    </div>`
  ).join('')}</div>`;
}

function renderOpening() {
  topArea.innerHTML = `<div class="logo-badge"><span>📱 スマプラン</span></div>`;

  const lines = (DATA.displayText || '').split(/[！!？?]/);
  const mainTitle = lines[0] || DATA.displayText || '';
  const sub = DATA.text ? DATA.text.slice(0, 60) : '';

  screen.className = 'phone-screen screen-opening';
  screen.innerHTML = `
    ${statusBar(true)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 28px;gap:24px;">
      <div class="title">${mainTitle}</div>
      <div class="divider"></div>
      <div class="subtitle">${sub}${sub.length >= 60 ? '…' : ''}</div>
    </div>
  `;

  bottomArea.innerHTML = `<div class="bottom-text">スマプランが徹底解説！</div>`;
}

function renderPlan() {
  const label = DATA.planLabel || (SCENE_TYPE === 'plan_a' ? 'Plan A' : 'Plan B');
  topArea.innerHTML = `<span class="plan-label">${label}</span>`;

  const priceFormatted = DATA.price ? Number(DATA.price).toLocaleString() : '';

  screen.className = 'phone-screen screen-plan';
  screen.innerHTML = `
    ${statusBar(false)}
    <div class="plan-header">
      <div class="plan-name">${DATA.planName || DATA.displayText}</div>
      ${priceFormatted ? `
        <div class="plan-pricing">
          <span class="amount">${priceFormatted}</span>
          <span class="unit">円/月（税込）</span>
        </div>
      ` : ''}
      ${DATA.dataGb ? `<div class="plan-data-badge"><span>📱 ${DATA.dataGb}</span></div>` : ''}
    </div>
    ${DATA.features && DATA.features.length > 0 ? featuresHTML(DATA.features) :
      `<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="plan-name" style="font-size:30px;color:rgba(255,255,255,0.85);text-align:center;line-height:1.5;">${DATA.displayText}</div>
      </div>`
    }
  `;

  bottomArea.innerHTML = '';
}

function renderMain() {
  const LABEL_MAP = {
    problem: '⚠️ 問題提起', question: '🤔 質問', reveal: '💡 解決策',
    benefit: '�� メリット', tip1: '💡 Tips 1', tip2: '💡 Tips 2',
    tip3: '💡 Tips 3', fact: '😲 知ってた？', detail: '🔍 詳しく解説',
    solution: '✅ 解決策', main: '📋 ポイント',
  };
  const label = LABEL_MAP[SCENE_TYPE] || DATA.label || SCENE_TYPE;
  topArea.innerHTML = `<span class="scene-label">${label}</span>`;

  screen.className = 'phone-screen screen-main';
  screen.innerHTML = `
    ${statusBar(false)}
    <div class="main-title">${DATA.displayText || ''}</div>
    <div class="main-divider"></div>
    ${DATA.features && DATA.features.length > 0 ? featuresHTML(DATA.features) :
      `<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="color:rgba(255,255,255,0.85);font-size:28px;font-weight:700;text-align:center;line-height:1.5;">${DATA.text ? DATA.text.slice(0, 80) : ''}</div>
      </div>`
    }
  `;

  bottomArea.innerHTML = '';
}

function renderRank() {
  topArea.innerHTML = `<span class="scene-label">🏆 ランキング</span>`;

  const rankClass = DATA.rank === 1 ? 'rank-1' : DATA.rank === 2 ? 'rank-2' : 'rank-3';
  const priceFormatted = DATA.price ? Number(DATA.price).toLocaleString() : '';

  screen.className = 'phone-screen screen-rank';
  screen.innerHTML = `
    ${statusBar(false)}
    <div style="display:flex;align-items:baseline;justify-content:center;">
      <span class="rank-number ${rankClass}">${DATA.rank}</span>
      <span class="rank-suffix">位</span>
    </div>
    <div class="plan-name" style="color:#fff;font-size:34px;font-weight:900;text-align:center;">${DATA.planName || DATA.displayText}</div>
    ${priceFormatted ? `
      <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;">
        <span style="color:#60A5FA;font-size:56px;font-weight:900;">${priceFormatted}</span>
        <span style="color:rgba(255,255,255,0.6);font-size:22px;font-weight:700;">円/月</span>
      </div>
    ` : ''}
    ${DATA.dataGb ? `<div class="plan-data-badge" style="align-self:center;"><span>📱 ${DATA.dataGb}</span></div>` : ''}
    ${DATA.features && DATA.features.length > 0 ?
      `<div class="features-list" style="width:100%;padding:0 4px;margin-top:8px;">${DATA.features.map(f =>
        `<div class="feature-item"><span class="feature-icon">${f.icon}</span><span class="feature-text">${f.text}</span></div>`
      ).join('')}</div>` :
      `<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px;">
        <div style="color:rgba(255,255,255,0.7);font-size:28px;font-weight:700;text-align:center;line-height:1.5;">${DATA.displayText}</div>
      </div>`
    }
  `;

  bottomArea.innerHTML = '';
}

function renderVerdict() {
  topArea.innerHTML = `<span class="scene-label">⚡ 結論</span>`;

  screen.className = 'phone-screen screen-verdict';

  if (DATA.right) {
    screen.innerHTML = `
      ${statusBar(true)}
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:100%;">
        <div class="verdict-box verdict-box-top">
          <div class="verdict-text">${DATA.left}</div>
        </div>
        <div class="verdict-vs"><span>VS</span></div>
        <div class="verdict-box verdict-box-bottom">
          <div class="verdict-text">${DATA.right}</div>
        </div>
      </div>
    `;
  } else {
    screen.innerHTML = `
      ${statusBar(true)}
      <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;">
        <div class="verdict-single">
          <div class="verdict-text">${DATA.left || DATA.displayText}</div>
        </div>
      </div>
    `;
  }

  bottomArea.innerHTML = `<div class="bottom-text">あな���に合うのはどっち？</div>`;
}

function renderCTA() {
  topArea.innerHTML = `<div class="bottom-cta-btn">無料診断してみ��� →</div>`;

  screen.className = 'phone-screen screen-cta';
  screen.innerHTML = `
    ${statusBar(false)}
    <div class="cta-urlbar">
      <span class="lock">🔒</span>
      <span class="url">smaplan.com</span>
    </div>
    <div class="cta-content">
      <div class="cta-heading">📱 あなたに最適な<br>スマホプランは？</div>
      <div class="cta-form-item">
        <div class="cta-form-label">月のデータ使用量は？</div>
        <div class="cta-form-options">
          <span class="cta-form-option">〜3GB</span>
          <span class="cta-form-option selected">3〜10GB</span>
          <span class="cta-form-option">10〜20GB</span>
          <span class="cta-form-option">20GB〜</span>
        </div>
      </div>
      <div class="cta-form-item">
