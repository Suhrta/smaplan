<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 50%, #0F172A 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .bg-circle-1 {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 500px;
    height: 500px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .bg-circle-2 {
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .bg-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 300px;
    opacity: 0.06;
    z-index: 0;
    user-select: none;
  }
  .content {
    z-index: 1;
    text-align: center;
    padding: 0 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .badge {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 40px;
    padding: 8px 32px;
    display: inline-block;
  }
  .badge span {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .title-container {
    background: rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 32px 48px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  #thumbnail-text {
    color: #fff;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 60px rgba(29,78,216,0.5);
    display: inline-block;
    white-space: nowrap;
  }
  .footer {
    position: absolute;
    bottom: 24px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    z-index: 1;
  }
  .site-name {
    color: rgba(255,255,255,0.7);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .cta-badge {
    background: #F59E0B;
    color: #0F172A;
    font-size: 22px;
    font-weight: 900;
    padding: 8px 24px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>
  <div class="bg-icon">📱</div>

  <div class="content">
    <div class="badge"><span>スマプラン</span></div>
    <div class="title-container">
      <span id="thumbnail-text">{{THUMBNAIL_TEXT}}</span>
    </div>
  </div>

  <div class="footer">
    <span class="site-name">smaplan.com</span>
    <span class="cta-badge">無料診断はこちら →</span>
  </div>

  <script>
    const el = document.getElementById('thumbnail-text');
    const container = el.parentElement;
    let size = 72;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > container.clientWidth - 96 && size > 32) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
    if (el.scrollWidth > container.clientWidth - 96) {
      el.style.whiteSpace = 'normal';
      el.style.wordBreak = 'keep-all';
    }
  </script>
</body>
</html>
