name: Generate blog posts

on:
  schedule:
    # 毎日 00:00 UTC = JST 09:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '生成する記事数'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-posts.mjs --count ${{ github.event.inputs.count || '1' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json data/blog-topics.json public/blog/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          COUNT=$(git diff --cached data/blog-posts.json | grep -c '^+    "slug"' || true)
          git commit -m "chore: auto-generate ${COUNT} blog post(s) via GitHub Actions"
          git push
