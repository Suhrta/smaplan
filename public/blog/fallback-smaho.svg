  <rect x="530" y="140" width="140" height="250" rx="12" fill="#fff" opacity="0.8"/>
  <rect x="530" y="140" width="140" height="250" rx="12" fill="none" stroke="#1D4ED8" stroke-width="3" opacity="0.25"/>
