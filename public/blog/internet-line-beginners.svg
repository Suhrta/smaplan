<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f0f2f8"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#fff" stroke="#e2e5f0" stroke-width="2"/>
  <!-- three option cards -->
  <!-- Card 1: Fiber -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#4338ca" opacity="0.04" stroke="#4338ca" stroke-width="2" opacity="0.2"/>
    <!-- fiber icon -->
    <circle cx="140" cy="80" r="40" fill="#4338ca" opacity="0.08"/>
    <path d="M120 80 Q130 60 140 80 Q150 100 160 80" stroke="#4338ca" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
    <circle cx="140" cy="80" r="6" fill="#4338ca" opacity="0.3"/>
    <!-- label -->
    <rect x="70" y="140" width="140" height="12" rx="6" fill="#4338ca" opacity="0.2"/>
    <!-- speed bar -->
    <rect x="40" y="180" width="200" height="10" rx="5" fill="#e2e5f0"/>
    <rect x="40" y="180" width="180" height="10" rx="5" fill="#4338ca" opacity="0.4"/>
    <!-- features -->
    <rect x="40" y="210" width="120" height="8" rx="4" fill="#4338ca" opacity="0.1"/>
    <rect x="40" y="228" width="100" height="8" rx="4" fill="#4338ca" opacity="0.08"/>
    <rect x="40" y="246" width="140" height="8" rx="4" fill="#4338ca" opacity="0.06"/>
    <!-- badge -->
    <rect x="70" y="280" width="140" height="32" rx="16" fill="#4338ca" opacity="0.08"/>
    <text x="140" y="301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#4338ca" opacity="0.4">Best Speed</text>
  </g>
  <!-- Card 2: Home Router -->
  <g transform="translate(460,140)">
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#4338ca" opacity="0.04" stroke="#4338ca" stroke-width="2" opacity="0.2"/>
    <!-- router icon -->
    <circle cx="140" cy="80" r="40" fill="#4338ca" opacity="0.08"/>
    <rect x="115" y="68" width="50" height="30" rx="6" fill="#4338ca" opacity="0.25"/>
    <line x1="128" y1="68" x2="125" y2="55" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="152" y1="68" x2="155" y2="55" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <circle cx="130" cy="82" r="3" fill="#0d9f5f" opacity="0.5"/>
    <circle cx="142" cy="82" r="3" fill="#0d9f5f" opacity="0.3"/>
    <!-- label -->
    <rect x="70" y="140" width="140" height="12" rx="6" fill="#4338ca" opacity="0.2"/>
    <!-- speed bar -->
    <rect x="40" y="180" width="200" height="10" rx="5" fill="#e2e5f0"/>
    <rect x="40" y="180" width="120" height="10" rx="5" fill="#4338ca" opacity="0.3"/>
    <!-- features -->
    <rect x="40" y="210" width="110" height="8" rx="4" fill="#4338ca" opacity="0.1"/>
    <rect x="40" y="228" width="90" height="8" rx="4" fill="#4338ca" opacity="0.08"/>
    <rect x="40" y="246" width="130" height="8" rx="4" fill="#4338ca" opacity="0.06"/>
    <!-- badge -->
    <rect x="70" y="280" width="140" height="32" rx="16" fill="#0d9f5f" opacity="0.1"/>
    <text x="140" y="301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0d9f5f" opacity="0.5">No Install</text>
  </g>
  <!-- Card 3: Mobile WiFi -->
  <g transform="translate(800,140)">
    <rect x="0" y="0" width="280" height="340" rx="20" fill="#4338ca" opacity="0.04" stroke="#4338ca" stroke-width="2" opacity="0.2"/>
    <!-- mobile wifi icon -->
    <circle cx="140" cy="80" r="40" fill="#4338ca" opacity="0.08"/>
    <rect x="115" y="62" width="50" height="36" rx="10" fill="#4338ca" opacity="0.2"/>
    <rect x="122" y="68" width="36" height="20" rx="4" fill="#4338ca" opacity="0.1"/>
    <circle cx="140" cy="78" r="3" fill="#0d9f5f" opacity="0.5"/>
    <!-- label -->
    <rect x="70" y="140" width="140" height="12" rx="6" fill="#4338ca" opacity="0.2"/>
    <!-- speed bar -->
    <rect x="40" y="180" width="200" height="10" rx="5" fill="#e2e5f0"/>
    <rect x="40" y="180" width="70" height="10" rx="5" fill="#4338ca" opacity="0.2"/>
    <!-- features -->
    <rect x="40" y="210" width="100" height="8" rx="4" fill="#4338ca" opacity="0.1"/>
    <rect x="40" y="228" width="120" height="8" rx="4" fill="#4338ca" opacity="0.08"/>
    <rect x="40" y="246" width="80" height="8" rx="4" fill="#4338ca" opacity="0.06"/>
    <!-- badge -->
    <rect x="70" y="280" width="140" height="32" rx="16" fill="#4338ca" opacity="0.06"/>
    <text x="140" y="301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#4338ca" opacity="0.35">Portable</text>
  </g>
  <!-- question mark -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#4338ca" opacity="0.3">Which one is right for you?</text>
</svg>
