<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f0f2f8"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#fff" stroke="#e2e5f0" stroke-width="2"/>
  <!-- bar chart -->
  <g transform="translate(180,120)">
    <!-- axis -->
    <line x1="0" y1="340" x2="840" y2="340" stroke="#e2e5f0" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="340" stroke="#e2e5f0" stroke-width="2"/>
    <!-- grid lines -->
    <line x1="0" y1="85" x2="840" y2="85" stroke="#e2e5f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="170" x2="840" y2="170" stroke="#e2e5f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="255" x2="840" y2="255" stroke="#e2e5f0" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- bars -->
    <rect x="60" y="80" width="100" height="260" rx="8" fill="#4338ca" opacity="0.6"/>
    <rect x="220" y="100" width="100" height="240" rx="8" fill="#4338ca" opacity="0.45"/>
    <rect x="380" y="60" width="100" height="280" rx="8" fill="#4338ca" opacity="0.3"/>
    <rect x="540" y="120" width="100" height="220" rx="8" fill="#4338ca" opacity="0.55"/>
    <rect x="700" y="170" width="100" height="170" rx="8" fill="#0d9f5f" opacity="0.4"/>
    <!-- labels -->
    <text x="110" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" opacity="0.7">A</text>
    <text x="270" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" opacity="0.7">B</text>
    <text x="430" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" opacity="0.7">C</text>
    <text x="590" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" opacity="0.7">D</text>
    <text x="750" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b" opacity="0.7">E</text>
    <!-- yen icon -->
    <text x="110" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#4338ca" opacity="0.5">\u00A5</text>
    <text x="270" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#4338ca" opacity="0.5">\u00A5</text>
    <text x="430" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#4338ca" opacity="0.5">\u00A5</text>
    <text x="590" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#4338ca" opacity="0.5">\u00A5</text>
    <text x="750" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0d9f5f" opacity="0.5">\u00A5</text>
  </g>
  <!-- down arrow (savings) -->
  <g transform="translate(940,280)">
    <circle r="30" fill="#0d9f5f" opacity="0.1"/>
    <path d="M0 -14 L0 10 M-10 2 L0 14 L10 2" stroke="#0d9f5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
</svg>
