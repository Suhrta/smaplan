<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f0f2f8"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#fff" stroke="#e2e5f0" stroke-width="2"/>
  <!-- smartphone -->
  <g transform="translate(260,130)">
    <rect x="0" y="0" width="120" height="200" rx="16" fill="#4338ca" opacity="0.08" stroke="#4338ca" stroke-width="2.5" opacity="0.3"/>
    <rect x="12" y="24" width="96" height="140" rx="4" fill="#4338ca" opacity="0.06"/>
    <circle cx="60" cy="185" r="8" fill="#4338ca" opacity="0.1"/>
    <rect x="40" y="10" width="40" height="5" rx="2.5" fill="#4338ca" opacity="0.12"/>
    <!-- screen content -->
    <rect x="22" y="40" width="76" height="10" rx="5" fill="#4338ca" opacity="0.15"/>
    <rect x="22" y="60" width="60" height="8" rx="4" fill="#4338ca" opacity="0.1"/>
    <rect x="22" y="80" width="50" height="8" rx="4" fill="#4338ca" opacity="0.1"/>
    <rect x="22" y="110" width="76" height="28" rx="8" fill="#0d9f5f" opacity="0.15"/>
    <text x="60" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0d9f5f" opacity="0.5">-1,100/mo</text>
  </g>
  <!-- connection line -->
  <g transform="translate(420,230)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#4338ca" stroke-width="3" stroke-dasharray="8 6" opacity="0.25"/>
    <circle cx="80" cy="0" r="16" fill="#4338ca" opacity="0.08"/>
    <text x="80" y="5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#4338ca" opacity="0.4">+</text>
  </g>
  <!-- router / fiber -->
  <g transform="translate(620,130)">
    <rect x="0" y="40" width="180" height="120" rx="16" fill="#4338ca" opacity="0.08" stroke="#4338ca" stroke-width="2.5" opacity="0.3"/>
    <line x1="45" y1="40" x2="38" y2="10" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="135" y1="40" x2="142" y2="10" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
    <circle cx="50" cy="75" r="7" fill="#0d9f5f" opacity="0.5"/>
    <circle cx="75" cy="75" r="7" fill="#0d9f5f" opacity="0.3"/>
    <circle cx="100" cy="75" r="7" fill="#4338ca" opacity="0.15"/>
    <rect x="30" y="105" width="120" height="3" rx="1.5" fill="#4338ca" opacity="0.08"/>
    <rect x="30" y="115" width="120" height="3" rx="1.5" fill="#4338ca" opacity="0.05"/>
    <!-- wifi waves -->
    <path d="M60 160 Q90 180 120 160" stroke="#4338ca" stroke-width="2.5" fill="none" opacity="0.2"/>
    <path d="M45 175 Q90 200 135 175" stroke="#4338ca" stroke-width="2.5" fill="none" opacity="0.15"/>
  </g>
  <!-- savings badge -->
  <g transform="translate(440,370)">
    <rect x="0" y="0" width="320" height="80" rx="20" fill="#0d9f5f" opacity="0.08" stroke="#0d9f5f" stroke-width="1.5" opacity="0.2"/>
    <text x="160" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#0d9f5f" opacity="0.6">Set Discount</text>
    <text x="160" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#0d9f5f" opacity="0.5">-\u00A552,800/year</text>
  </g>
  <!-- down arrows -->
  <path d="M600 460 L600 500 M590 490 L600 505 L610 490" stroke="#0d9f5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
</svg>
