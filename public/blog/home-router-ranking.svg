<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f0f2f8"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#fff" stroke="#e2e5f0" stroke-width="2"/>
  <!-- three routers -->
  <!-- Router 1 (center, larger) -->
  <g transform="translate(480,120)">
    <rect x="0" y="40" width="240" height="140" rx="20" fill="#4338ca" opacity="0.08" stroke="#4338ca" stroke-width="2.5" opacity="0.3"/>
    <!-- antennas -->
    <line x1="60" y1="40" x2="50" y2="0" stroke="#4338ca" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <line x1="120" y1="40" x2="120" y2="0" stroke="#4338ca" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <line x1="180" y1="40" x2="190" y2="0" stroke="#4338ca" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <!-- LEDs -->
    <circle cx="60" cy="80" r="8" fill="#0d9f5f" opacity="0.6"/>
    <circle cx="90" cy="80" r="8" fill="#0d9f5f" opacity="0.4"/>
    <circle cx="120" cy="80" r="8" fill="#4338ca" opacity="0.2"/>
    <circle cx="150" cy="80" r="8" fill="#4338ca" opacity="0.15"/>
    <circle cx="180" cy="80" r="8" fill="#4338ca" opacity="0.1"/>
    <!-- ventilation lines -->
    <rect x="50" y="110" width="140" height="3" rx="1.5" fill="#4338ca" opacity="0.08"/>
    <rect x="50" y="120" width="140" height="3" rx="1.5" fill="#4338ca" opacity="0.06"/>
    <rect x="50" y="130" width="140" height="3" rx="1.5" fill="#4338ca" opacity="0.04"/>
    <!-- wifi waves -->
    <path d="M90 160 Q120 180 150 160" stroke="#4338ca" stroke-width="3" fill="none" opacity="0.25"/>
    <path d="M70 175 Q120 200 170 175" stroke="#4338ca" stroke-width="3" fill="none" opacity="0.18"/>
    <path d="M50 190 Q120 220 190 190" stroke="#4338ca" stroke-width="3" fill="none" opacity="0.1"/>
    <!-- crown -->
    <g transform="translate(95,-20)">
      <polygon points="25,0 0,20 10,20 5,30 45,30 40,20 50,20" fill="#f59e0b" opacity="0.4"/>
    </g>
  </g>
  <!-- Router 2 (left, smaller) -->
  <g transform="translate(120,220)">
    <rect x="0" y="30" width="180" height="100" rx="16" fill="#4338ca" opacity="0.06" stroke="#4338ca" stroke-width="1.5" opacity="0.2"/>
    <line x1="45" y1="30" x2="38" y2="0" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <line x1="135" y1="30" x2="142" y2="0" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <circle cx="50" cy="65" r="6" fill="#0d9f5f" opacity="0.4"/>
    <circle cx="72" cy="65" r="6" fill="#0d9f5f" opacity="0.25"/>
    <circle cx="94" cy="65" r="6" fill="#4338ca" opacity="0.12"/>
    <rect x="40" y="90" width="100" height="2.5" rx="1" fill="#4338ca" opacity="0.06"/>
    <rect x="40" y="98" width="100" height="2.5" rx="1" fill="#4338ca" opacity="0.04"/>
  </g>
  <!-- Router 3 (right, smaller) -->
  <g transform="translate(900,220)">
    <rect x="0" y="30" width="180" height="100" rx="16" fill="#4338ca" opacity="0.06" stroke="#4338ca" stroke-width="1.5" opacity="0.2"/>
    <line x1="45" y1="30" x2="38" y2="0" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <line x1="135" y1="30" x2="142" y2="0" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <circle cx="50" cy="65" r="6" fill="#0d9f5f" opacity="0.4"/>
    <circle cx="72" cy="65" r="6" fill="#0d9f5f" opacity="0.25"/>
    <circle cx="94" cy="65" r="6" fill="#4338ca" opacity="0.12"/>
    <rect x="40" y="90" width="100" height="2.5" rx="1" fill="#4338ca" opacity="0.06"/>
    <rect x="40" y="98" width="100" height="2.5" rx="1" fill="#4338ca" opacity="0.04"/>
  </g>
  <!-- ranking badges -->
  <circle cx="600" cy="420" r="24" fill="#4338ca" opacity="0.12"/>
  <text x="600" y="428" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#4338ca" opacity="0.5">1</text>
  <circle cx="210" cy="420" r="20" fill="#4338ca" opacity="0.08"/>
  <text x="210" y="427" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#4338ca" opacity="0.4">2</text>
  <circle cx="990" cy="420" r="20" fill="#4338ca" opacity="0.08"/>
  <text x="990" y="427" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#4338ca" opacity="0.4">3</text>
  <!-- subtitle -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#4338ca" opacity="0.4">Home Router Top 3</text>
</svg>
