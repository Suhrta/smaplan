<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f0f2f8"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="#fff" stroke="#e2e5f0" stroke-width="2"/>
  <!-- VS divider -->
  <line x1="600" y1="120" x2="600" y2="520" stroke="#e2e5f0" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="600" cy="315" r="36" fill="#4338ca" opacity="0.1"/>
  <text x="600" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#4338ca" opacity="0.5">VS</text>
  <!-- Left: fiber optic -->
  <g transform="translate(200,160)">
    <!-- ONU box -->
    <rect x="40" y="60" width="160" height="100" rx="12" fill="#4338ca" opacity="0.08" stroke="#4338ca" stroke-width="2" opacity="0.25"/>
    <rect x="60" y="80" width="40" height="6" rx="3" fill="#4338ca" opacity="0.3"/>
    <rect x="60" y="96" width="30" height="6" rx="3" fill="#4338ca" opacity="0.2"/>
    <circle cx="170" cy="90" r="5" fill="#0d9f5f" opacity="0.6"/>
    <circle cx="170" cy="108" r="5" fill="#0d9f5f" opacity="0.3"/>
    <!-- fiber cable -->
    <line x1="0" y1="110" x2="40" y2="110" stroke="#4338ca" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M-20 110 Q-10 90 0 110 Q10 130 20 110" stroke="#4338ca" stroke-width="2" fill="none" opacity="0.3"/>
    <!-- speed indicator -->
    <rect x="60" y="180" width="100" height="24" rx="12" fill="#0d9f5f" opacity="0.12"/>
    <text x="110" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0d9f5f" opacity="0.7">HIGH SPEED</text>
  </g>
  <text x="300" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#4338ca" opacity="0.5">Fiber Optic</text>
  <!-- Right: home router -->
  <g transform="translate(700,160)">
    <!-- router body -->
    <rect x="50" y="50" width="140" height="90" rx="14" fill="#4338ca" opacity="0.08" stroke="#4338ca" stroke-width="2" opacity="0.25"/>
    <!-- antennas -->
    <line x1="80" y1="50" x2="75" y2="20" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="160" y1="50" x2="165" y2="20" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <!-- LEDs -->
    <circle cx="90" cy="80" r="5" fill="#0d9f5f" opacity="0.6"/>
    <circle cx="110" cy="80" r="5" fill="#0d9f5f" opacity="0.3"/>
    <circle cx="130" cy="80" r="5" fill="#4338ca" opacity="0.2"/>
    <circle cx="150" cy="80" r="5" fill="#4338ca" opacity="0.15"/>
    <!-- wifi waves -->
    <path d="M105 100 Q120 112 135 100" stroke="#4338ca" stroke-width="2" fill="none" opacity="0.2"/>
    <path d="M95 110 Q120 128 145 110" stroke="#4338ca" stroke-width="2" fill="none" opacity="0.15"/>
    <path d="M85 120 Q120 144 155 120" stroke="#4338ca" stroke-width="2" fill="none" opacity="0.1"/>
    <!-- plug icon -->
    <rect x="90" y="180" width="60" height="24" rx="12" fill="#4338ca" opacity="0.08"/>
    <text x="120" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#4338ca" opacity="0.4">NO WORK</text>
  </g>
  <text x="900" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#4338ca" opacity="0.5">Home Router</text>
</svg>
